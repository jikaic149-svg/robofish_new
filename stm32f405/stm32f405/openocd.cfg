source [find interface/stlink.cfg]
transport select swd
source [find target/stm32f4x.cfg]
adapter speed 1000
bindto 127.0.0.1

# Wired factory/debug requires NRST. Halt before application enables software IWDG.
reset_config srst_only srst_nogate connect_assert_srst
$_TARGETNAME configure -event halted {
    mmw 0xE0042008 0x00001000 0
}
$_TARGETNAME configure -event reset-init {
    if {([mrw 0xE0042000] & 0xFFF) != 0x413 || [mrh 0x1FFF7A22] != 1024} {
        error "Expected STM32F405/407 family with 1MiB flash; refusing factory image"
    }
    mmw 0xE0042008 0x00001000 0
    if {([mrw 0xE0042008] & 0x00001000) == 0} {
        error "IWDG debug freeze did not latch; refusing flash"
    }
    if {([mrw 0x40023C14] & 0x20) == 0} {
        error "Hardware IWDG option requires a separately verified programming flow"
    }
}
